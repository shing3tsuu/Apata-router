[project]
name = "apata-router"
version = "0.1.0"
description = "Routing server for Apata Messenger"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18",
    "asyncpg>=0.30",
    "cryptography>=46.0.0",
    "dishka>=1.10.0",
    "fastapi>=0.115",
    "pydantic>=2.13.0",
    "python-jose[cryptography]>=3.5.0",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
    "types-python-jose>=3.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
